services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hakwarga_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    environment:
      SERVER_NAME: ":80"
      SERVER_ROOT: "public/"
      APP_NAME: "HakWarga"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "https://kinerja.web.id"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: hakwarga
      DB_USERNAME: hakwarga
      DB_PASSWORD: ${DB_PASSWORD:-hakwarga_secret_prod_2026}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      HW_SIMULATED_BANNER: "true"
      HW_NIK_PEPPER: ${HW_NIK_PEPPER:-8f4a3c1e9b2d5a7f6e8c0b1d3a5f7e9c2b4d6a8f0e1c3b5a7d9f2e4b6a8c0d1e}
      HW_DEMO_PASSWORD: "hakwarga2026"
      APP_KEY: ${APP_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage

  db:
    image: postgres:16-alpine
    container_name: hakwarga_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hakwarga
      POSTGRES_USER: hakwarga
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hakwarga_secret_prod_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hakwarga -d hakwarga"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  storage_data:
