name: Kinerja CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hakwarga_testing
          POSTGRES_USER: hakwarga
          POSTGRES_PASSWORD: secretpassword
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, zip, bcmath, gd
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Verify Code Style (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Static Analysis (Larastan)
        run: ./vendor/bin/phpstan analyse

      - name: Prepare Environment & Run Migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: hakwarga_testing
          DB_USERNAME: hakwarga
          DB_PASSWORD: secretpassword
          APP_KEY: base64:y7dMMTtvkiZqHsNWvT9/p5tOWosIPznze/IQNMNoWco=
          HW_NIK_PEPPER: ci-secret-pepper-32-chars-long-1234
        run: |
          touch .env
          php artisan migrate --force --seed

      - name: Execute Pest Test Suite
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: hakwarga_testing
          DB_USERNAME: hakwarga
          DB_PASSWORD: secretpassword
          APP_KEY: base64:y7dMMTtvkiZqHsNWvT9/p5tOWosIPznze/IQNMNoWco=
          HW_NIK_PEPPER: ci-secret-pepper-32-chars-long-1234
        run: ./vendor/bin/pest
