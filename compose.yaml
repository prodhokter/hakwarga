services:
  db:
    image: postgres:16-alpine
    container_name: hakwarga_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hakwarga
      POSTGRES_USER: hakwarga
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hakwarga -d hakwarga"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
